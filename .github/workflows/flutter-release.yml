name: Android release

# Every push to main produces one signed APK release after the Flutter quality gate.
# Pull Requests are validated by the regular CI workflows and do not publish releases.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  API_URL: ${{ vars.API_URL }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate SemVer release
        id: version
        run: node .github/scripts/next-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Quality gate
        working-directory: frontend
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Validate production API URL
        run: |
          test -n "$API_URL" || { echo "Repository variable API_URL is missing" >&2; exit 1; }
          case "$API_URL" in
            https://*) ;;
            *) echo "API_URL must use HTTPS" >&2; exit 1 ;;
          esac
          case "$API_URL" in
            */api|*/api/|*/) echo "API_URL must not end with / or /api" >&2; exit 1 ;;
          esac
      - name: Prepare signing keystore
        working-directory: frontend
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build signed APK
        working-directory: frontend
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: tool/build_release.sh
      - name: Remove signing files
        if: always()
        working-directory: frontend
        run: rm -f android/release.jks android/key.properties
      - name: Rename APK
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk "gametracker-${{ steps.version.outputs.version }}.apk"
      - name: Create Git tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "gametracker-${RELEASE_VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "GameTracker ${RELEASE_TAG}" \
            --generate-notes
